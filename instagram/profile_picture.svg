<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" shape-rendering="geometricPrecision">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="250" fill="url(#bgGrad)"/>

  <!-- Outer glow ring -->
  <circle cx="250" cy="250" r="238" fill="none" stroke="#00AAFF" stroke-width="2" opacity="0.4"/>
  <!-- Main border ring -->
  <circle cx="250" cy="250" r="232" fill="none" stroke="#00AAFF" stroke-width="4"/>

  <!-- ===== STEERING WHEEL ===== -->
  <!-- cx=250, cy=178, outer ring r=92, ring thickness=13 -->

  <!-- Outer ring of wheel -->
  <circle cx="250" cy="178" r="92" fill="none" stroke="#00AAFF" stroke-width="13" filter="url(#glow)"/>

  <!-- Spokes (3-spoke, one up, two lower) -->
  <!-- Spoke UP: from hub edge (250,156) to ring inner (250,89) -->
  <line x1="250" y1="156" x2="250" y2="90" stroke="#00AAFF" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Spoke BOTTOM-RIGHT (30°): hub (269,189) to ring (320,225) -->
  <line x1="269" y1="189" x2="322" y2="226" stroke="#00AAFF" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Spoke BOTTOM-LEFT (150°): hub (231,189) to ring (178,225) -->
  <line x1="231" y1="189" x2="178" y2="226" stroke="#00AAFF" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center hub -->
  <circle cx="250" cy="178" r="20" fill="#00AAFF" filter="url(#glow)"/>
  <circle cx="250" cy="178" r="10" fill="#0A0A0A"/>
  <circle cx="250" cy="178" r="4" fill="#00AAFF"/>

  <!-- ===== SEPARATOR LINE ===== -->
  <line x1="140" y1="310" x2="360" y2="310" stroke="#00AAFF" stroke-width="1.5" opacity="0.6"/>

  <!-- ===== TEXT ===== -->
  <!-- MI monogram -->
  <text x="250" y="385"
        font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif"
        font-weight="900"
        font-size="108"
        fill="white"
        text-anchor="middle"
        letter-spacing="14">MI</text>

  <!-- Subtext -->
  <text x="250" y="418"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-weight="400"
        font-size="18"
        fill="#00AAFF"
        text-anchor="middle"
        letter-spacing="5.5">MOTORYZACYJNE</text>
</svg>
