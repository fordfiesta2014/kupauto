<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Parusdetail – Szablon Posta Instagram</title>
  <meta name="hz:slide-selector" content=".post">
  <meta name="hz:canvas-width" content="1080">
  <meta name="hz:canvas-height" content="1080">
  <link rel="stylesheet" href="https://use.typekit.net/wnu0yyl.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 40px;
    }

    .post {
      position: relative;
      width: 1080px;
      height: 1080px;
      background: #040810;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* ─── Background ─── */
    .bg-base {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, #0D2045 0%, transparent 65%),
        radial-gradient(ellipse 50% 40% at 15% 50%, #0A1A3A 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 40%, #081630 0%, transparent 60%),
        linear-gradient(180deg, #05080F 0%, #020407 50%, #010305 100%);
    }

    /* ─── Wall horizon line ─── */
    .wall-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 440px;
      height: 1px;
      background: linear-gradient(to right,
        transparent 0%,
        rgba(60, 120, 220, 0.15) 20%,
        rgba(60, 120, 220, 0.25) 50%,
        rgba(60, 120, 220, 0.15) 80%,
        transparent 100%);
    }

    /* ─── Floor gradient ─── */
    .floor {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 500px;
      background:
        linear-gradient(180deg,
          transparent 0%,
          rgba(6, 12, 28, 0.6) 30%,
          rgba(4, 8, 18, 0.85) 60%,
          #020408 100%);
    }

    /* ─── Floor reflection shine ─── */
    .floor-shine {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: 700px;
      height: 280px;
      background: radial-gradient(ellipse at 50% 0%,
        rgba(30, 80, 180, 0.12) 0%,
        transparent 70%);
    }

    /* ─── LED Neon Beams ─── */
    .beams {
      position: absolute;
      inset: 0;
    }

    /* ─── Car image area ─── */
    .car-area {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      width: 960px;
      height: 580px;
    }

    .car-placeholder {
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(80, 140, 220, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .car-placeholder-icon {
      opacity: 0.2;
    }

    .car-placeholder-text {
      font-family: "source-sans-3", sans-serif;
      font-size: 13px;
      color: rgba(100, 160, 230, 0.35);
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    /* ─── Top section ─── */
    .top-bar {
      position: absolute;
      top: 52px;
      left: 60px;
      right: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-mark {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-diamond {
      width: 8px;
      height: 8px;
      background: rgba(168, 200, 240, 0.8);
      transform: rotate(45deg);
    }

    .logo-text {
      font-family: "bebas-neue-v14-deprecated", sans-serif;
      font-size: 18px;
      color: rgba(168, 200, 240, 0.9);
      letter-spacing: 6px;
    }

    .top-service-tag {
      font-family: "source-sans-3", sans-serif;
      font-size: 10px;
      color: rgba(100, 150, 220, 0.5);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* ─── Horizontal accent lines ─── */
    .h-line-top {
      position: absolute;
      top: 80px;
      left: 60px;
      right: 60px;
      height: 1px;
      background: linear-gradient(to right,
        rgba(100, 160, 230, 0.5) 0%,
        rgba(100, 160, 230, 0.2) 50%,
        rgba(100, 160, 230, 0.5) 100%);
    }

    .h-line-bottom {
      position: absolute;
      bottom: 160px;
      left: 60px;
      right: 60px;
      height: 1px;
      background: linear-gradient(to right,
        rgba(100, 160, 230, 0.5) 0%,
        rgba(100, 160, 230, 0.2) 50%,
        rgba(100, 160, 230, 0.5) 100%);
    }

    /* ─── Corner marks ─── */
    .corner { position: absolute; width: 20px; height: 20px; }
    .corner-tl { top: 36px; left: 36px; border-top: 1px solid rgba(140,190,240,0.5); border-left: 1px solid rgba(140,190,240,0.5); }
    .corner-tr { top: 36px; right: 36px; border-top: 1px solid rgba(140,190,240,0.5); border-right: 1px solid rgba(140,190,240,0.5); }
    .corner-bl { bottom: 36px; left: 36px; border-bottom: 1px solid rgba(140,190,240,0.5); border-left: 1px solid rgba(140,190,240,0.5); }
    .corner-br { bottom: 36px; right: 36px; border-bottom: 1px solid rgba(140,190,240,0.5); border-right: 1px solid rgba(140,190,240,0.5); }

    /* ─── Bottom brand section ─── */
    .brand-bar {
      position: absolute;
      bottom: 52px;
      left: 60px;
      right: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-name {
      font-family: "bebas-neue-v14-deprecated", sans-serif;
      font-size: 58px;
      color: #FFFFFF;
      letter-spacing: 14px;
      line-height: 1;
    }

    .brand-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }

    .brand-tagline {
      font-family: "source-sans-3", sans-serif;
      font-size: 10px;
      color: rgba(140, 190, 240, 0.6);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .brand-dot-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .brand-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(100, 160, 230, 0.5);
    }

    .brand-dot.active {
      background: rgba(168, 200, 240, 0.9);
    }

  </style>
</head>
<body>
  <div class="post" data-canvas-width="1080" data-canvas-height="1080">

    <!-- Background layers -->
    <div class="bg-base"></div>

    <!-- LED neon beams (SVG) -->
    <svg class="beams" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feColorMatrix type="matrix"
            values="0.2 0 0 0 0.15   0 0.4 0 0 0.55   0 0 1 0 1   0 0 0 0.9 0"
            in="blur" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <filter id="glow-soft" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="8" result="blur"/>
          <feColorMatrix type="matrix"
            values="0 0 0 0 0.1   0 0.3 0 0 0.5   0 0 1 0 0.9   0 0 0 0.5 0"
            in="blur" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Left LED strip — main -->
      <line x1="148" y1="0" x2="390" y2="610" stroke="white" stroke-width="1.8" opacity="0.85" filter="url(#glow)"/>
      <!-- Left LED strip — shadow/soft -->
      <line x1="148" y1="0" x2="390" y2="610" stroke="#4488FF" stroke-width="8" opacity="0.2" filter="url(#glow-soft)"/>

      <!-- Left LED strip — inner (thinner, parallel) -->
      <line x1="180" y1="0" x2="415" y2="580" stroke="white" stroke-width="0.6" opacity="0.45" filter="url(#glow)"/>

      <!-- Right LED strip — main -->
      <line x1="932" y1="0" x2="690" y2="610" stroke="white" stroke-width="1.8" opacity="0.85" filter="url(#glow)"/>
      <!-- Right LED strip — shadow/soft -->
      <line x1="932" y1="0" x2="690" y2="610" stroke="#4488FF" stroke-width="8" opacity="0.2" filter="url(#glow-soft)"/>

      <!-- Right LED strip — inner (thinner, parallel) -->
      <line x1="900" y1="0" x2="665" y2="580" stroke="white" stroke-width="0.6" opacity="0.45" filter="url(#glow)"/>

      <!-- Top horizontal LED strip -->
      <line x1="250" y1="118" x2="830" y2="118" stroke="white" stroke-width="1.5" opacity="0.75" filter="url(#glow)"/>
      <line x1="250" y1="118" x2="830" y2="118" stroke="#6AA0FF" stroke-width="10" opacity="0.15" filter="url(#glow-soft)"/>

      <!-- Second horizontal strip (behind top) -->
      <line x1="310" y1="152" x2="770" y2="152" stroke="white" stroke-width="0.7" opacity="0.35" filter="url(#glow)"/>

      <!-- Subtle side ambient glow -->
      <ellipse cx="0" cy="380" rx="180" ry="340" fill="rgba(20,60,180,0.08)"/>
      <ellipse cx="1080" cy="320" rx="180" ry="300" fill="rgba(20,60,180,0.07)"/>
    </svg>

    <!-- Wall horizon line -->
    <div class="wall-line"></div>

    <!-- Floor -->
    <div class="floor"></div>
    <div class="floor-shine"></div>

    <!-- Car placeholder area -->
    <div class="car-area">
      <div class="car-placeholder">
        <svg class="car-placeholder-icon" width="80" height="40" viewBox="0 0 80 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="16" width="78" height="20" rx="4" stroke="#4488FF" stroke-width="1.5"/>
          <path d="M14 16 L22 4 L58 4 L66 16" stroke="#4488FF" stroke-width="1.5" fill="none"/>
          <circle cx="20" cy="36" r="6" stroke="#4488FF" stroke-width="1.5" fill="none"/>
          <circle cx="60" cy="36" r="6" stroke="#4488FF" stroke-width="1.5" fill="none"/>
        </svg>
        <span class="car-placeholder-text">Twoje auto tutaj</span>
      </div>
    </div>

    <!-- Corner marks -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Horizontal accent lines -->
    <div class="h-line-top"></div>
    <div class="h-line-bottom"></div>

    <!-- Top bar -->
    <div class="top-bar">
      <div class="logo-mark">
        <div class="logo-diamond"></div>
        <span class="logo-text">PARUSDETAIL</span>
      </div>
      <span class="top-service-tag">Car Detailing</span>
    </div>

    <!-- Bottom brand bar -->
    <div class="brand-bar">
      <div class="brand-name">PARUSDETAIL</div>
      <div class="brand-right">
        <span class="brand-tagline">Profesjonalny Detailing</span>
        <div class="brand-dot-row">
          <div class="brand-dot active"></div>
          <div class="brand-dot"></div>
          <div class="brand-dot"></div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
